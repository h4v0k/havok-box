name = "havok-box-snapshot"
main = "worker.js"
compatibility_date = "2026-11-01"

# Create with: wrangler kv namespace create SNAPSHOTS  -- then paste the returned id here.
[[kv_namespaces]]
binding = "SNAPSHOTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never put in this file): wrangler secret put PUBLISH_TOKEN / VIEW_TOKEN
