# havok-box scope file — the single authority for what may be touched.
# Copy to config/scope.yaml and edit. Anything not listed here is out of scope and refused.
# LAB USE ONLY.

name: home-lab
owner: havok

networks:
  # Lab targets normally come from an ENGAGEMENT (dashboard "Engagement" card or `hb engage`):
  # find the lab, pick its networks, and they're in scope for 12 hours. List a range here only if
  # it's a fixed lab that never moves.
  include: []
  # NEVER-TOUCH list. Engagements can't override it, and lab discovery skips it. Put your home
  # network, gateways and anything that isn't a test target here.
  exclude:
    - 192.168.1.0/24      # home network (example; use yours)
  # ISOLATED lab VLAN(s) where LLMNR/NBT-NS/mDNS poisoning and mitm6 are allowed. Leave EMPTY unless
  # this is a segmented test network with no production hosts — poisoning affects every host on it.
  poison_allowed: []
    # - 10.10.99.0/24

wifi:
  ssids:
    - LAB-NET
  bssids:
    - "aa:bb:cc:dd:ee:ff"   # compared case-insensitively

rf:
  ble_addresses: []
  subghz_ids: []
  # Required before any rf.transmit / rf.replay is allowed. US ISM defaults; edit for your bench.
  tx_bands:
    - { min_mhz: 314.9,  max_mhz: 315.1, label: "315 ISM" }
    - { min_mhz: 433.05, max_mhz: 434.79, label: "433 ISM" }
    - { min_mhz: 902.0,  max_mhz: 928.0, label: "915 ISM" }

# Allowed without asking (listening only). Everything else needs dashboard approval.
auto_allow:
  - recon.passive
  # - recon.discovery   # uncomment to let "Discover hosts" (Standard) sweep in-scope nets without asking

# Active categories — all require per-action approval, bound to one task and consumed once:
# Domains you own, for mitm6 (net.poison with a -d domain).
domains: []
  # - lab.local

approval_required:
  - net.poison
  - wifi.rogue_ap
  - recon.active
  - wifi.deauth
  - wifi.inject
  - wifi.capture        # handshake/PMKID capture on one AP (bound to wifi.bssids)
  - ble.active          # GATT connect to a BLE device (bound to rf.ble_addresses)
  - rf.replay
  - rf.transmit
  - auth.attempt
  - exploit.tool
